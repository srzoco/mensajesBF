<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Armador · CIL</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#001E54">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script>
    // El Armador ahora vive dentro de CIL. Esta dirección vieja (ícono guardado) lleva a la nueva,
    // borra la clave de GitHub que pudo quedar guardada en el teléfono y quita el guardado viejo de esta dirección.
    // tasas.json y data.json se siguen publicando aquí (los lee el Armador de CIL).
    try { localStorage.removeItem('barquero-armador-gh-token'); } catch (e) { /* nada */ }
    try { navigator.serviceWorker && navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { if (/\/mensajesBF\/$/i.test(new URL(r.scope).pathname)) r.unregister(); }); }); } catch (e) { /* nada */ }
    location.replace('../cil/mensajes/' + location.hash);
  </script>
</head>
<body style="font-family: system-ui, sans-serif; padding: 24px;">
